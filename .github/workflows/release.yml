name: Release

# Release erstellen:  git tag v1.2.0 && git push origin v1.2.0
# Manuell starten (Actions > Release > Run workflow) baut alles als Test, ohne Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Tag v1.2.0 -> Version 1.2.0 (build.sh entfernt das "v"); ohne Tag: Testversion
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must point to a commit on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME zeigt auf einen Commit, der nicht auf main liegt. Kein Release."
            exit 1
          fi
          echo "OK: $GITHUB_REF_NAME liegt auf main"
      - name: CHANGELOG entry
        if: github.ref_type == 'tag'
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## \[$v\]" CHANGELOG.md \
            && echo "OK: CHANGELOG enthält [$v]" \
            || echo "::warning::CHANGELOG.md hat keinen Abschnitt [$v] – Release-Notizen werden automatisch erzeugt."

  macos:
    name: macOS (Universal)
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: ./build.sh mac
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x64 + arm64)
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: ./build.sh windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.exe
            dist/LICENSE.txt
            dist/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  sbom:
    name: SBOM (CycloneDX)
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - name: Generate SBOM per OS
        run: |
          mkdir -p dist
          for os in darwin windows linux; do
            tags="desktop,production"; [ "$os" = linux ] && tags="$tags,webkit2_41"
            name="$os"; [ "$os" = darwin ] && name=mac
            out="dist/SerialMonitor-${VERSION#v}-$name.sbom.cdx.json"
            GOOS=$os CGO_ENABLED=1 GOFLAGS="-tags=$tags" \
              "$(go env GOPATH)/bin/cyclonedx-gomod" app -json -licenses -assert-licenses -std -main . -output "$out" .
            echo "$out: $(jq '.components | length' "$out") Komponenten"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: dist/*.sbom.cdx.json
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    needs: verify
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install GTK/WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: ./build.sh linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [macos, windows, linux, sbom]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          # Abschnitt "## [x.y.z]" bis zum nächsten "## [" bzw. den Link-Definitionen
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          # Vorabversion: Bindestrich (v1.3.0-beta.1) oder 0.x
          if [[ "$GITHUB_REF_NAME" == *-* || "$GITHUB_REF_NAME" == v0.* ]]; then flags+=(--prerelease); fi
          if [ -s notes.md ]; then flags+=(--notes-file notes.md); else flags+=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Serial Monitor $GITHUB_REF_NAME" \
            "${flags[@]}"
