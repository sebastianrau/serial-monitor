name: CI

# Runs on every pull request and on pushes to main.
# The job names are required status checks in the branch protection of main – rename them only together with the ruleset.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install GTK/WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || { echo "::error::go.mod/go.sum not tidy – run 'go mod tidy'"; exit 1; }
      - name: go vet
        run: go vet -tags desktop,production,webkit2_41 ./...
      - name: go test
        run: go test -tags desktop,production,webkit2_41 ./...
      - name: JavaScript syntax
        run: for f in frontend/*.js; do node --check "$f"; done
      - name: Translations complete (de/en)
        run: |
          node -e '
            const src = require("fs").readFileSync("frontend/i18n.js", "utf8");
            const I18N = new Function(src + "; return I18N;")();
            const de = Object.keys(I18N.de), en = Object.keys(I18N.en);
            const miss = [...de.filter(k => !en.includes(k)).map(k => "en: " + k), ...en.filter(k => !de.includes(k)).map(k => "de: " + k)];
            if (miss.length) { console.error("Missing translations:\n" + miss.join("\n")); process.exit(1); }
            console.log(de.length + " keys in both languages");'
      - name: Third-party licenses
        run: ./scripts/licenses.sh /tmp/THIRD_PARTY_LICENSES.txt

  build:
    name: Build (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macOS
            runner: macos-15
            cmd: ./build.sh mac
          - target: Windows
            runner: ubuntu-24.04
            cmd: ./build.sh windows
          - target: Linux
            runner: ubuntu-24.04
            cmd: ./build.sh linux
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install GTK/WebKitGTK
        if: matrix.target == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: ${{ matrix.cmd }}
