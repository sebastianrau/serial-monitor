<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Serial Monitor</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #dfe2e7; --text: #1d2229; --muted: #6b7380;
    --hover: rgba(0,0,0,.05); --accent: #00878a; --accent-soft: rgba(0,135,138,.12); --accent-text: #ffffff;
    --out-bg: #ffffff; --tx: #8a5a00; --sys: #7a7f88; --err: #c0392b; --ts: #8a93a0; --ok: #2ecc71;
    --shadow: 0 8px 28px rgba(0,0,0,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16191d; --panel: #1d2127; --border: #2c3239; --text: #e3e6ea; --muted: #8d95a1;
      --hover: rgba(255,255,255,.06); --accent: #17a2a5; --accent-soft: rgba(23,162,165,.18); --accent-text: #ffffff;
      --out-bg: #111418; --tx: #e0a83a; --sys: #8d95a1; --err: #ff6b5e; --ts: #6b7380;
      --shadow: 0 8px 28px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  select, input[type=text], input[type=number], button {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; height: 28px;
  }
  input[type=number] { width: 96px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled, select:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); min-width: 96px; font-weight: 500; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }

  /* Toolbar */
  .toolbar {
    position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .spacer { flex: 1; }
  .vsep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }
  #portSel { max-width: 320px; }
  button.icon, .tgl {
    display: inline-flex; align-items: center; justify-content: center; height: 28px; min-width: 28px;
    padding: 0 6px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted);
  }
  button.icon:hover:not(:disabled), .tgl:hover { background: var(--hover); color: var(--text); border-color: transparent; }
  .tgl { position: relative; cursor: pointer; user-select: none; }
  .tgl input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
  .tgl:has(input:checked) { color: var(--accent); background: var(--accent-soft); }
  .tgl:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tgl.txt { font: 600 10.5px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .03em; }
  #btnSettings[aria-expanded=true] { color: var(--accent); background: var(--accent-soft); }

  /* Einstellungen */
  .panel {
    position: absolute; top: calc(100% + 4px); right: 8px; z-index: 10;
    width: min(340px, calc(100vw - 16px)); max-height: calc(100vh - 70px); overflow: auto;
    padding: 6px 14px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
  }
  .panel h3 {
    margin: 12px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
  .row > span:first-child { color: var(--text); }
  .row select, .row input[type=number] { width: 150px; }
  .row .hint { color: var(--muted); font-size: 12px; }
  .inline { display: inline-flex; gap: 12px; }
  .about { display: flex; align-items: center; gap: 12px; padding: 4px 0 2px; }
  .about-name { font-weight: 600; }
  .about a { color: var(--accent); text-decoration: none; font-size: 12px; }
  .about a:hover { text-decoration: underline; }
  .inline label { display: inline-flex; align-items: center; gap: 4px; }

  /* Ausgabe */
  #out {
    flex: 1; overflow: auto; margin: 0; padding: 8px 12px; background: var(--out-bg);
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-all;
  }
  #out.nowrap { white-space: pre; word-break: normal; }
  .line { min-height: 1.45em; }
  .ts { color: var(--ts); }
  .tx { color: var(--tx); }
  .sys { color: var(--sys); font-style: italic; }
  .err { color: var(--err); }

  /* Eingabe & Status */
  .sendrow { display: flex; gap: 6px; padding: 6px 8px; background: var(--panel); border-top: 1px solid var(--border); }
  #input { flex: 1; min-width: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #lineEnd { max-width: 170px; }
  .statusbar {
    display: flex; align-items: center; gap: 8px; padding: 3px 10px; font-size: 11.5px; color: var(--muted);
    background: var(--panel); border-top: 1px solid var(--border);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .6; }
  .dot.on { background: var(--ok); opacity: 1; }
  #counters { font-variant-numeric: tabular-nums; }
  .update { color: var(--accent); font-weight: 600; text-decoration: none; }
  .update:hover { text-decoration: underline; }
  button.icon.off { opacity: .4; cursor: default; }
  button.icon.off:hover { background: transparent; color: var(--muted); }
  #tip {
    position: fixed; z-index: 100; display: none; max-width: 280px; padding: 5px 8px; border-radius: 6px;
    background: var(--text); color: var(--bg); font-size: 12px; line-height: 1.35; pointer-events: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.2);
  }
  #unsupported { display: none; padding: 10px 12px; background: var(--err); color: #fff; }
</style>
</head>
<body>

<div id="unsupported" data-i18n-html="unsupported"></div>

<!-- Toolbar -->
<header class="toolbar">
  <button class="primary" id="btnConnect" data-i18n="connect"></button>
  <select id="portSel" data-i18n-title="portSelTitle"></select>
  <button class="icon" id="btnRefresh" data-i18n-title="refreshTitle">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
  </button>
  <button id="btnAddPort" data-i18n="addPort" data-i18n-title="addPortTitle"></button>
  <select id="baudSel" data-i18n-title="baud">
    <option value="300">300 Baud</option><option value="1200">1200 Baud</option><option value="2400">2400 Baud</option>
    <option value="4800">4800 Baud</option><option value="9600">9600 Baud</option><option value="19200">19200 Baud</option>
    <option value="38400">38400 Baud</option><option value="57600">57600 Baud</option><option value="74880">74880 Baud</option>
    <option value="115200">115200 Baud</option><option value="230400">230400 Baud</option><option value="250000">250000 Baud</option>
    <option value="460800">460800 Baud</option><option value="500000">500000 Baud</option><option value="921600">921600 Baud</option>
    <option value="1000000">1000000 Baud</option><option value="2000000">2000000 Baud</option>
    <option value="custom" data-i18n="baudCustom"></option>
  </select>
  <input type="number" id="baudCustom" min="50" max="20000000" step="1" placeholder="Baud" hidden>
  <input type="hidden" id="baud" value="115200">

  <div class="spacer"></div>

  <label class="tgl" data-i18n-title="timestamp"><input type="checkbox" id="timestamp">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></label>
  <label class="tgl txt" data-i18n-title="hexView"><input type="checkbox" id="hexView">HEX</label>
  <label class="tgl" data-i18n-title="autoscroll"><input type="checkbox" id="autoscroll" checked>
    <svg viewBox="0 0 24 24"><path d="m7 6 5 5 5-5"/><path d="m7 13 5 5 5-5"/></svg></label>
  <span class="vsep"></span>
  <button class="icon off" id="btnReset" data-i18n-title="resetTitle" aria-disabled="true">
    <svg viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M7.05 6.5a7.5 7.5 0 1 0 9.9 0"/></svg>
  </button>
  <button class="icon" id="btnClear" data-i18n-title="clearTitle">
    <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13"/></svg>
  </button>
  <button class="icon" id="btnSave" data-i18n-title="saveTitle">
    <svg viewBox="0 0 24 24"><path d="M12 3.5v11"/><path d="m7.5 10 4.5 4.5 4.5-4.5"/><path d="M4.5 16.5v3h15v-3"/></svg>
  </button>
  <button class="icon" id="btnSettings" aria-expanded="false" data-i18n-title="settings">
    <svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
  </button>

  <!-- Einstellungen -->
  <div class="panel" id="settingsPanel" hidden>
    <h3 data-i18n="secConnection"></h3>
    <label class="row" data-i18n-title="autoConnectTitle"><span data-i18n="autoConnect"></span><input type="checkbox" id="autoConnect" checked></label>
    <label class="row"><span data-i18n="dataBits"></span>
      <select id="dataBits"><option>8</option><option>7</option></select></label>
    <label class="row"><span data-i18n="parity"></span>
      <select id="parity"><option value="none" data-i18n="parityNone"></option><option value="even" data-i18n="parityEven"></option><option value="odd" data-i18n="parityOdd"></option></select></label>
    <label class="row"><span data-i18n="stopBits"></span>
      <select id="stopBits"><option>1</option><option>2</option></select></label>
    <label class="row"><span data-i18n="flow"></span>
      <select id="flow"><option value="none" data-i18n="flowNone"></option><option value="hardware" data-i18n="flowHw"></option></select></label>
    <label class="row"><span data-i18n="buffer"></span>
      <input type="number" id="bufSize" value="4096" min="256" step="256"></label>
    <div class="row"><span>DTR / RTS</span>
      <span class="inline"><label><input type="checkbox" id="dtr"> DTR</label><label><input type="checkbox" id="rts"> RTS</label></span></div>
    <h3 data-i18n="secDisplay"></h3>
    <label class="row"><span data-i18n="wrap"></span><input type="checkbox" id="wrap" checked></label>
    <label class="row"><span data-i18n="maxLines"></span>
      <input type="number" id="maxLines" value="10000" min="100" step="100"></label>

    <h3 data-i18n="secSend"></h3>
    <label class="row"><span data-i18n="echo"></span><input type="checkbox" id="echo" checked></label>
    <label class="row"><span><span data-i18n="hexSend"></span> <span class="hint" data-i18n="hexSendHint"></span></span><input type="checkbox" id="hexSend"></label>
    <label class="row"><span data-i18n="clearOnSend"></span><input type="checkbox" id="clearOnSend" checked></label>

    <h3 data-i18n="language"></h3>
    <label class="row"><span>Sprache / Language</span>
      <select id="lang">
        <option value="auto" data-i18n="langAuto"></option>
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select></label>

    <h3 data-i18n="about"></h3>
    <div class="about">
      <img src="appicon.png" alt="" width="44" height="44">
      <div>
        <div class="about-name">Serial Monitor <span id="appVersion" class="hint"></span></div>
        <div class="hint"><span data-i18n="license"></span> · © 2026 Sebastian Rau</div>
        <a id="repoLink" href="https://github.com/sebastianrau/serial-monitor" target="_blank" rel="noopener" data-i18n="sourceCode"></a>
      </div>
    </div>
    <label class="row" id="checkUpdatesRow" data-i18n-title="checkUpdatesTip"><span data-i18n="checkUpdates"></span><input type="checkbox" id="checkUpdates" checked></label>
  </div>
</header>

<!-- Ausgabe -->
<div id="out"></div>

<!-- Eingabe -->
<div class="sendrow">
  <input type="text" id="input" data-i18n-placeholder="inputPlaceholder" autocomplete="off" spellcheck="false">
  <select id="lineEnd" data-i18n-title="lineEnd">
    <option value="none" data-i18n="leNone"></option>
    <option value="lf" data-i18n="leLF"></option>
    <option value="cr" data-i18n="leCR"></option>
    <option value="crlf" data-i18n="leBoth"></option>
  </select>
  <button class="primary" id="btnSend" data-i18n="send"></button>
</div>
<footer class="statusbar">
  <span class="dot" id="dot"></span>
  <span id="status" data-i18n="statusDisconnected"></span>
  <span class="spacer"></span>
  <a id="updateLink" class="update" href="#" hidden></a>
  <span id="counters">RX 0 B · TX 0 B</span>
</footer>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
