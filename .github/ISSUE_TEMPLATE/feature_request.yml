name: Feature request
description: Suggest an idea / Idee vorschlagen
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the use case – what are you trying to achieve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
      description: Optional – your idea for the feature.
